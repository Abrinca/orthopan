[project]
name = "orthopan"
version = "0.1.0"
description = "Scalable, interactive viewer for pangenomes"
readme = "README.md"
authors = [
    { name = "Thomas Roder", email = "thomas@abrinca.com" }
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.md"]
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.142.2",
    "polars>=1.44.2",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
orthopan = "orthopan:main"
orthopan-tree = "orthopan.tree:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
