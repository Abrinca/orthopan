<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>OrthoPan</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // set the theme before first paint to avoid a light flash
      (function () {
        try {
          var s = localStorage.getItem('orthopan.theme');
          var dark =
            s === 'dark' ||
            (s !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <script>
      // luma.gl reports shader compile/link failures only through console.error
      // (deck's onError never fires). Hook it before the bundle captures
      // console.error, and forward to window.__onShaderError when set.
      (function () {
        var orig = console.error.bind(console);
        var re = /shader|compile|link|program|glsl|wgsl/i;
        console.error = function () {
          try {
            var msg = Array.prototype.map
              .call(arguments, function (a) {
                if (a && a.message) return a.message;
                if (typeof a === 'string') return a;
                try {
                  return String(a);
                } catch (e) {
                  return '';
                }
              })
              .join(' ');
            if (window.__onShaderError && re.test(msg)) window.__onShaderError(msg);
          } catch (e) {}
          return orig.apply(console, arguments);
        };
      })();
    </script>
    <style>
      :root {
        --tree-w: 200px;
        --label-w: 170px;
        --track-h: 68px;
      }
      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #ffffff;
        --panel: #f8fafc;
        --surface: #ffffff;
        --border: #d0d5dd;
        --border-soft: #eef2f6;
        --text: #1f2937;
        --dim: #475467;
        --faint: #667085;
        --accent: #2563eb;
        --accent-bg: #2563eb;
        --accent-text: #ffffff;
        --input-bg: #ffffff;
        --hover: #eff4ff;
        --tooltip-bg: rgba(17,24,39,0.92);
        --tooltip-text: #f9fafb;
        --tooltip-accent: #93c5fd;
        --tooltip-dim: #cbd5e1;
        --tooltip-border: transparent;
        --notice: #b54708;
        --disabled: #98a2b3;
        --disabled-border: #e4e7ec;
        --badge-bg: #fef0c7;
        --badge-text: #b54708;
        --shadow: 0 6px 18px rgba(0,0,0,0.12);
        --shadow-panel: -4px 0 12px rgba(0,0,0,0.08);
        --code-bg: #f2f4f7;
        --sel-bg: #fffbeb;
        --sel-border: #fde68a;
        --toast-bg: #ffffff;
        --toast-border: #d0d5dd;
        --toast-text: #1f2937;
        --toast-shadow: 0 6px 20px rgba(0,0,0,0.16);
        --toast-error-bg: #fef2f2;
        --toast-error-border: #fecaca;
        --toast-error-text: #b91c1c;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0b1220;
        --panel: #111827;
        --surface: #0f172a;
        --border: #334155;
        --border-soft: #1f2937;
        --text: #e5e7eb;
        --dim: #cbd5e1;
        --faint: #94a3b8;
        --accent: #60a5fa;
        --accent-bg: #2563eb;
        --accent-text: #ffffff;
        --input-bg: #1f2937;
        --hover: #1e293b;
        --tooltip-bg: rgba(2,6,23,0.95);
        --tooltip-text: #f1f5f9;
        --tooltip-accent: #93c5fd;
        --tooltip-dim: #94a3b8;
        --tooltip-border: #334155;
        --notice: #fbbf24;
        --disabled: #64748b;
        --disabled-border: #334155;
        --badge-bg: #422006;
        --badge-text: #fbbf24;
        --shadow: 0 6px 18px rgba(0,0,0,0.5);
        --shadow-panel: -6px 0 22px rgba(0,0,0,0.6);
        --code-bg: #1f2937;
        --sel-bg: #3b2f10;
        --sel-border: #a16207;
        --toast-bg: #111827;
        --toast-border: #334155;
        --toast-text: #e5e7eb;
        --toast-shadow: 0 6px 20px rgba(0,0,0,0.6);
        --toast-error-bg: #450a0a;
        --toast-error-border: #7f1d1d;
        --toast-error-text: #fecaca;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
        font: 12px/1.35 system-ui, -apple-system, Segoe UI, sans-serif; color: var(--text); }
      #app { display: flex; flex-direction: column; height: 100%; }

      #topbar { display: flex; flex-wrap: nowrap; align-items: center; gap: 8px 10px; padding: 5px 10px;
        height: 42px; box-sizing: border-box; overflow-x: auto; overflow-y: hidden;
        border-bottom: 1px solid var(--border); background: var(--panel); z-index: 5; }
      #topbar > * { flex: 0 0 auto; }
      #topbar h1 { font-size: 13px; margin: 0 8px 0 0; font-weight: 600; }
      #topbar label { color: var(--dim); }
      #topbar select, #topbar button, #topbar input,
      .aln-controls select, .aln-controls button,
      .drawer-head select, .drawer-head button,
      #panel .copyid {
        font: inherit; padding: 3px 6px; background: var(--input-bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 3px; }
      #topbar button { cursor: pointer; }
      /* fixed width so switching auto/light/dark never reflows the header */
      #theme { width: 74px; }
      #status { margin-left: auto; color: var(--faint); white-space: nowrap; }
      #toast-container { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
        z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 8px;
        pointer-events: none; max-width: 96vw; }
      #toast-container .toast { pointer-events: auto; min-width: 240px; max-width: min(90vw, 560px);
        background: var(--toast-bg); color: var(--toast-text); border: 1px solid var(--toast-border);
        border-radius: 6px; box-shadow: var(--toast-shadow); padding: 8px 10px;
        display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
      #toast-container .toast-error { background: var(--toast-error-bg); border-color: var(--toast-error-border);
        color: var(--toast-error-text); }
      #toast-container .toast-row { display: flex; align-items: center; gap: 8px; }
      #toast-container .toast-body { flex: 1 1 auto; white-space: pre-wrap; word-break: break-word; }
      #toast-container .toast-body.clickable { cursor: pointer; text-decoration: underline dotted; }
      #toast-container .toast-action, #toast-container .toast-details-toggle, #toast-container .toast-close {
        font: inherit; color: inherit; background: transparent; border: 1px solid currentColor;
        border-radius: 3px; padding: 2px 8px; cursor: pointer; }
      #toast-container .toast-details-toggle[aria-expanded='true'] { background: rgba(128, 128, 128, 0.25); }
      #toast-container .toast-close { border: none; font-size: 14px; line-height: 1; padding: 0 4px; }
      #toast-container .toast-details { border-top: 1px solid currentColor; padding-top: 5px;
        font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap; word-break: break-word; }
      #legend { display: inline-flex; align-items: stretch; height: 12px; border: 1px solid var(--border);
        border-radius: 2px; overflow: hidden; vertical-align: middle; }
      #legend span { display: inline-block; min-width: 14px; line-height: 10px; font-size: 8px;
        text-align: center; color: var(--text); }
      #sortbtn { display: none; }
      #sortbtn.visible { display: inline-block; }

      #search-wrap { position: relative; }
      #search { width: 180px; }
      #search-results { position: fixed; --dropdown-min: 300px; min-width: 300px; max-height: 340px;
        overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
        box-shadow: var(--shadow); display: none; z-index: 30; }
      #search-results.visible { display: block; }
      #search-results .total { padding: 4px 8px; color: var(--faint); font-size: 11px; border-bottom: 1px solid var(--border-soft); }
      #search-results ul { margin: 0; padding: 0; list-style: none; }
      #search-results li { padding: 4px 8px; cursor: pointer; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; }
      #search-results li:hover { background: var(--hover); }
      #search-results .field { color: var(--faint); }
      #search-results .snippet { color: var(--dim); }

      #layers { position: relative; }
      #layers summary { cursor: pointer; color: var(--dim); }
      #layer-list { position: fixed; background: var(--surface); border: 1px solid var(--border);
        border-radius: 4px; box-shadow: var(--shadow); padding: 6px 10px; --dropdown-min: 210px; min-width: 210px;
        max-height: 360px; overflow: auto; z-index: 30; }
      #layer-list h4 { margin: 6px 0 2px; font-size: 11px; color: var(--faint); }
      #layer-list label { display: block; white-space: nowrap; }
      #layer-list .swatch { display: inline-block; width: 10px; height: 10px; border: 1px solid rgba(128,128,128,0.4);
        vertical-align: middle; margin-right: 4px; border-radius: 2px; }

      #body { display: flex; flex: 1; min-height: 0; position: relative; }
      #tree-col { width: var(--tree-w); flex: 0 0 var(--tree-w); position: relative;
        border-right: 1px solid var(--border); }
      #tree-col canvas { position: absolute; left: 0; right: 0; top: var(--track-h); bottom: 0;
        width: 100%; height: calc(100% - var(--track-h)); }
      #tree-spacer { height: var(--track-h); border-bottom: 1px solid var(--border); }

      #meta-col { position: relative; border-right: 1px solid var(--border); }
      #meta-col canvas { position: absolute; left: 0; right: 0; top: var(--track-h); bottom: 0;
        width: 100%; height: calc(100% - var(--track-h)); }
      #meta-spacer { height: var(--track-h); border-bottom: 1px solid var(--border); }

      #center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      #tracks { height: var(--track-h); flex: 0 0 var(--track-h); position: relative;
        border-bottom: 1px solid var(--border); }
      #tracks canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #matrix-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
      #deck { position: absolute; inset: 0; }
      #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      #tooltip { position: fixed; pointer-events: none; display: none; z-index: 70;
        background: var(--tooltip-bg); color: var(--tooltip-text); padding: 5px 7px; border-radius: 4px;
        border: 1px solid var(--tooltip-border);
        font-size: 11px; max-width: 340px; white-space: nowrap; }
      #tooltip b { color: var(--tooltip-accent); font-weight: 600; }
      #tooltip .tip-dim { color: var(--tooltip-dim); }

      #labels-col { width: var(--label-w); flex: 0 0 var(--label-w); position: relative;
        border-left: 1px solid var(--border); }
      #labels-col.collapsed { width: 14px; flex: 0 0 14px; }
      #labels-col canvas { position: absolute; left: 0; right: 0; top: var(--track-h); bottom: 0;
        width: 100%; height: calc(100% - var(--track-h)); }
      #labels-spacer { height: var(--track-h); border-bottom: 1px solid var(--border); }

      /* detail drawer overlaying the matrix; the label column stays visible */
      #panel { position: absolute; top: 0; right: var(--label-w); bottom: 0; width: 400px;
        background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-panel);
        display: none; z-index: 20; flex-direction: column; min-width: 300px; }
      #panel.visible { display: flex; }
      .drawer-head { display: flex; flex-wrap: nowrap; align-items: center; gap: 3px 4px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
      .drawer-head #drawer-title { font-weight: 600; font-size: 13px; min-width: 0; flex: 0 1 auto; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
      .drawer-head .grow { flex: 1; }
      .drawer-head a.dl { text-decoration: none; color: var(--accent); border: 1px solid var(--border); border-radius: 3px; white-space: nowrap; padding: 2px 6px; }
      .drawer-head a.dl.disabled { color: var(--disabled); border-color: var(--disabled-border); pointer-events: none; }
      .drawer-head .close { border: none; background: none; font-size: 16px; cursor: pointer; color: var(--text); }
      .navbtn { font: inherit; padding: 1px 6px; cursor: pointer; }
      .drawer-actions { padding: 8px 10px; border-bottom: 1px solid var(--border); }
      #open-aln { font: inherit; padding: 6px 10px; background: var(--accent-bg); color: var(--accent-text); border: none; border-radius: 4px; cursor: pointer; }
      #tab-members { overflow: auto; padding: 10px 12px; flex: 1; min-height: 0; }
      #panel h2 { font-size: 13px; margin: 10px 0 6px; }
      #panel h2:first-child { margin-top: 0; }
      #panel table { border-collapse: collapse; width: 100%; margin: 6px 0; }
      #panel td { padding: 2px 4px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
      #panel td:first-child { color: var(--faint); white-space: nowrap; }
      #panel ul { margin: 4px 0 0; padding-left: 16px; }
      #panel code { background: var(--code-bg); padding: 0 3px; border-radius: 3px; }
      #panel .linkish { color: var(--accent); cursor: pointer; }
      #panel .linkish:hover { text-decoration: underline; }
      .tree-legend { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 10px; color: var(--dim); }
      .tree-legend .lg { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
      .tree-legend .lg i { display: inline-block; width: 9px; height: 9px; border: 1px solid rgba(128,128,128,0.4); border-radius: 1px; }
      .tree-legend .lg i.dup { background: var(--surface); border: 1.4px solid var(--text); border-radius: 0; transform: rotate(45deg); width: 7px; height: 7px; margin: 0 2px; }
      #panel .genome-list { padding-left: 0; list-style: none; }
      #panel .genome-group { margin: 6px 0; }
      #panel .genome-group > b { color: var(--text); }
      #panel .genome-group ul { padding-left: 16px; }
      #panel .copyid { font-size: 10px; padding: 0 4px; margin-left: 4px; cursor: pointer; }
      #panel .muted { color: var(--faint); }
      #panel .sel-genome { background: var(--sel-bg); border: 1px solid var(--sel-border); border-radius: 4px;
        padding: 6px 8px; margin: 0 0 8px; }
      #panel .sel-genome.absent { background: var(--panel); border-color: var(--border); color: var(--faint); }
      #panel .sel-genome ul { margin: 4px 0 0; padding-left: 16px; }
      #panel .genome-group.selected { background: var(--hover); border-radius: 3px; }

      /* full-screen alignment view (tree | colour | gene | MSA) */
      #aln-view { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: none; flex-direction: column; }
      #aln-view.open { display: flex; }
      #aln-header { flex: 0 0 auto; border-bottom: 1px solid var(--border); background: var(--bg); }
      .aln-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 4px 8px; }
      .aln-controls label { color: var(--dim); }
      .aln-controls a.dl { text-decoration: none; color: var(--accent); border: 1px solid var(--border); border-radius: 3px; white-space: nowrap; padding: 2px 6px; }
      .aln-controls a.dl.disabled { color: var(--disabled); border-color: var(--disabled-border); pointer-events: none; }
      #aln-badges .badge { font-size: 10px; padding: 1px 5px; border-radius: 8px; background: var(--badge-bg); color: var(--badge-text); }
      #aln-badges .badge.src { background: var(--border-soft); color: var(--dim); }
      #aln-status { color: var(--faint); }
      #aln-legend { margin: 2px 8px; }
      #aln-bar { display: block; width: 100%; height: 38px; }
      #aln-scroll { flex: 1; min-height: 0; overflow-y: auto; position: relative; background: var(--bg); }
      #aln-rows { position: relative; }
      #aln-canvas { position: sticky; top: 0; display: block; width: 100%; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <h1>OrthoPan</h1>
        <label for="theme">Theme</label>
        <select id="theme" title="Colour theme">
          <option value="auto">auto</option>
          <option value="light">light</option>
          <option value="dark">dark</option>
        </select>
        <label for="order">Order</label>
        <select id="order"></select>
        <button id="sortbtn" title="Sort orthogroups by presence contrast inside the selected clade">sort by contrast</button>
        <label for="mode">Value</label>
        <select id="mode">
          <option value="presence">presence</option>
          <option value="copies">copies</option>
        </select>
        <label for="tree-shape">Tree</label>
        <select id="tree-shape" title="Genome tree drawing: branch lengths or topology">
          <option value="phylogram">phylogram</option>
          <option value="cladogram">cladogram</option>
        </select>
        <span id="legend" title="Cell colour scale"></span>
        <span id="search-wrap">
          <input id="search" type="search" placeholder="search annotations / OG…" autocomplete="off" />
          <button id="search-order" title="Order orthogroups with the search hits first">Order by hits</button>
          <div id="search-results"></div>
        </span>
        <details id="layers"><summary>Layers</summary><div id="layer-list"></div></details>
        <span id="status">loading…</span>
      </div>
      <div id="body">
        <div id="tree-col">
          <div id="tree-spacer"></div>
          <canvas id="tree"></canvas>
        </div>
        <div id="meta-col">
          <div id="meta-spacer"></div>
          <canvas id="meta"></canvas>
        </div>
        <div id="center">
          <div id="tracks"><canvas id="tracks-canvas"></canvas></div>
          <div id="matrix-wrap">
            <div id="deck"></div>
            <canvas id="overlay"></canvas>
            <div id="tooltip"></div>
          </div>
        </div>
        <div id="labels-col">
          <div id="labels-spacer"></div>
          <canvas id="labels"></canvas>
        </div>
        <div id="panel">
          <div class="drawer-head">
            <button id="drawer-prev" class="navbtn" title="previous orthogroup (←)">‹</button>
            <button id="drawer-next" class="navbtn" title="next orthogroup (→)">›</button>
            <span id="drawer-title">orthogroup</span>
            <span class="grow"></span>
            <label>IDs <select id="id-mode"><option value="display">display</option><option value="raw">raw</option></select></label>
            <a id="dl-fasta" class="dl" download>FASTA</a>
            <a id="dl-aligned" class="dl" download>aligned</a>
            <a id="dl-nwk" class="dl" download>Newick</a>
            <button id="drawer-close" class="close" aria-label="close">×</button>
          </div>
          <div class="drawer-actions">
            <button id="open-aln">Open alignment view</button>
          </div>
          <div id="tab-members"></div>
        </div>
      </div>
    </div>
    <div id="aln-view" hidden>
      <div id="aln-header">
        <div class="aln-controls">
          <button id="aln-prev" class="navbtn" title="previous orthogroup (←)">‹</button>
          <button id="aln-next" class="navbtn" title="next orthogroup (→)">›</button>
          <b id="aln-title">orthogroup</b>
          <span id="aln-badges"></span>
          <span id="aln-status"></span>
          <span class="grow" style="flex:1"></span>
          <label>IDs <select id="aln-id-mode"><option value="display">display</option><option value="raw">raw</option></select></label>
          <a id="aln-dl-fasta" class="dl" download>FASTA</a>
          <a id="aln-dl-aligned" class="dl" download>aligned</a>
          <a id="aln-dl-nwk" class="dl" download>Newick</a>
          <label>Colour <select id="aln-field"></select></label>
          <label>Layout
            <select id="aln-mode">
              <option value="phylogram">phylogram</option>
              <option value="cladogram">cladogram</option>
            </select>
          </label>
          <button id="aln-zoom-out" title="zoom out">−</button>
          <button id="aln-zoom-in" title="zoom in">+</button>
          <button id="aln-retry" hidden>retry</button>
          <button id="aln-close" class="close" aria-label="back to matrix">×</button>
        </div>
        <div id="aln-legend" class="tree-legend"></div>
        <canvas id="aln-bar"></canvas>
      </div>
      <div id="aln-scroll">
        <div id="aln-rows"><canvas id="aln-canvas"></canvas></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
