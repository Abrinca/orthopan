<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>OrthoPan</title>
    <style>
      :root {
        --tree-w: 200px;
        --label-w: 170px;
        --track-h: 68px;
        --border: #d0d5dd;
        --panel: #f8fafc;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden;
        font: 12px/1.35 system-ui, -apple-system, Segoe UI, sans-serif; color: #1f2937; }
      #app { display: flex; flex-direction: column; height: 100%; }

      #topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 5px 10px;
        border-bottom: 1px solid var(--border); background: var(--panel); z-index: 5; }
      #topbar h1 { font-size: 13px; margin: 0 8px 0 0; font-weight: 600; }
      #topbar label { color: #475467; }
      #topbar select, #topbar button, #topbar input { font: inherit; padding: 3px 6px; }
      #topbar button { cursor: pointer; }
      #status { margin-left: auto; color: #667085; white-space: nowrap; }
      #notice { color: #b54708; white-space: nowrap; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; }
      #legend { display: inline-flex; align-items: stretch; height: 12px; border: 1px solid var(--border);
        border-radius: 2px; overflow: hidden; vertical-align: middle; }
      #legend span { display: inline-block; min-width: 14px; line-height: 10px; font-size: 8px;
        text-align: center; color: #1f2937; }
      #sortbtn { display: none; }
      #sortbtn.visible { display: inline-block; }

      #search-wrap { position: relative; }
      #search { width: 180px; }
      #search-results { position: absolute; top: 100%; left: 0; min-width: 300px; max-height: 340px;
        overflow: auto; background: #fff; border: 1px solid var(--border); border-radius: 4px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.12); display: none; z-index: 30; }
      #search-results.visible { display: block; }
      #search-results .total { padding: 4px 8px; color: #667085; font-size: 11px; border-bottom: 1px solid #eef2f6; }
      #search-results ul { margin: 0; padding: 0; list-style: none; }
      #search-results li { padding: 4px 8px; cursor: pointer; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; }
      #search-results li:hover { background: #eff4ff; }
      #search-results .field { color: #667085; }
      #search-results .snippet { color: #475467; }

      #layers { position: relative; }
      #layers summary { cursor: pointer; color: #475467; }
      #layer-list { position: absolute; right: 0; top: 100%; background: #fff; border: 1px solid var(--border);
        border-radius: 4px; box-shadow: 0 6px 18px rgba(0,0,0,0.12); padding: 6px 10px; min-width: 210px;
        max-height: 360px; overflow: auto; z-index: 30; }
      #layer-list h4 { margin: 6px 0 2px; font-size: 11px; color: #667085; }
      #layer-list label { display: block; white-space: nowrap; }
      #layer-list .swatch { display: inline-block; width: 10px; height: 10px; border: 1px solid rgba(0,0,0,0.15);
        vertical-align: middle; margin-right: 4px; border-radius: 2px; }

      #body { display: flex; flex: 1; min-height: 0; position: relative; }
      #tree-col { width: var(--tree-w); flex: 0 0 var(--tree-w); position: relative;
        border-right: 1px solid var(--border); }
      #tree-col canvas { position: absolute; left: 0; right: 0; top: var(--track-h); bottom: 0;
        width: 100%; height: calc(100% - var(--track-h)); }
      #tree-spacer { height: var(--track-h); border-bottom: 1px solid var(--border); }

      #meta-col { position: relative; border-right: 1px solid var(--border); }
      #meta-col canvas { position: absolute; left: 0; right: 0; top: var(--track-h); bottom: 0;
        width: 100%; height: calc(100% - var(--track-h)); }
      #meta-spacer { height: var(--track-h); border-bottom: 1px solid var(--border); }

      #center { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      #tracks { height: var(--track-h); flex: 0 0 var(--track-h); position: relative;
        border-bottom: 1px solid var(--border); }
      #tracks canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #matrix-wrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
      #deck { position: absolute; inset: 0; }
      #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      #tooltip { position: fixed; pointer-events: none; display: none; z-index: 40;
        background: rgba(17,24,39,0.92); color: #f9fafb; padding: 5px 7px; border-radius: 4px;
        font-size: 11px; max-width: 340px; white-space: nowrap; }
      #tooltip b { color: #93c5fd; font-weight: 600; }
      #tooltip .tip-dim { color: #cbd5e1; }

      #labels-col { width: var(--label-w); flex: 0 0 var(--label-w); position: relative;
        border-left: 1px solid var(--border); }
      #labels-col.collapsed { width: 14px; flex: 0 0 14px; }
      #labels-col canvas { position: absolute; left: 0; right: 0; top: var(--track-h); bottom: 0;
        width: 100%; height: calc(100% - var(--track-h)); }
      #labels-spacer { height: var(--track-h); border-bottom: 1px solid var(--border); }

      /* wide detail drawer overlaying the matrix; the label column stays visible */
      #panel { position: absolute; top: 0; right: var(--label-w); bottom: 0; width: 380px;
        background: #fff; border-left: 1px solid var(--border); box-shadow: -4px 0 12px rgba(0,0,0,0.08);
        display: none; z-index: 20; flex-direction: column; min-width: 300px; }
      #panel.visible { display: flex; }
      #panel.expanded { width: 62%; }
      #drawer-resize { position: absolute; left: -5px; top: 0; bottom: 0; width: 10px; cursor: ew-resize; }
      .drawer-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
      .drawer-head #drawer-title { font-weight: 600; font-size: 13px; min-width: 0; max-width: 100%; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap; }
      .drawer-head .grow { flex: 1; }
      .drawer-head button, .drawer-head a.dl, .drawer-head select { font: inherit; padding: 2px 6px; }
      .drawer-head a.dl { text-decoration: none; color: #2563eb; border: 1px solid var(--border); border-radius: 3px; white-space: nowrap; }
      .drawer-head a.dl.disabled { color: #98a2b3; border-color: #e4e7ec; pointer-events: none; }
      .drawer-head .close { border: none; background: none; font-size: 16px; cursor: pointer; }
      .tabs { display: flex; gap: 4px; padding: 4px 8px 0; border-bottom: 1px solid var(--border); }
      .tab { border: 1px solid transparent; background: none; padding: 4px 10px; cursor: pointer; color: #475467; }
      .tab.active { color: #111827; border-color: var(--border); border-bottom-color: #fff; border-radius: 4px 4px 0 0; }
      .tab-pane { display: none; flex: 1; min-height: 0; }
      .tab-pane.active { display: flex; flex-direction: column; }
      #tab-members { overflow: auto; padding: 10px 12px; display: none; }
      #tab-members.active { display: block; }
      #panel h2 { font-size: 13px; margin: 10px 0 6px; }
      #panel h2:first-child { margin-top: 0; }
      #panel table { border-collapse: collapse; width: 100%; margin: 6px 0; }
      #panel td { padding: 2px 4px; border-bottom: 1px solid #eef2f6; vertical-align: top; }
      #panel td:first-child { color: #667085; white-space: nowrap; }
      #panel ul { margin: 4px 0 0; padding-left: 16px; }
      #panel code { background: #f2f4f7; padding: 0 3px; border-radius: 3px; }
      #panel .linkish { color: #2563eb; cursor: pointer; }
      #panel .linkish:hover { text-decoration: underline; }
      .pane-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 4px 8px; border-bottom: 1px solid #eef2f6; }
      .pane-toolbar .spacer { flex: 1; }
      .pane-toolbar .badge { font-size: 10px; padding: 1px 5px; border-radius: 8px; background: #fef0c7; color: #b54708; }
      .pane-toolbar .badge.src { background: #eef2f6; color: #475467; }
      .tree-legend { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 10px; color: #475467; }
      .tree-legend .lg { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
      .tree-legend .lg i { display: inline-block; width: 9px; height: 9px; border: 1px solid rgba(0,0,0,0.2); border-radius: 1px; }
      .tree-legend .lg i.dup { background: #fff; border: 1.4px solid #111827; border-radius: 0; transform: rotate(45deg); width: 7px; height: 7px; margin: 0 2px; }
      #panel .genome-list { padding-left: 0; list-style: none; }
      #panel .genome-group { margin: 6px 0; }
      #panel .genome-group > b { color: #111827; }
      #panel .genome-group ul { padding-left: 16px; }
      #panel .copyid { font-size: 10px; padding: 0 4px; margin-left: 4px; cursor: pointer; }
      #panel .muted { color: #667085; }
      .canvas-wrap { position: relative; flex: 1; min-height: 0; }
      .canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <h1>OrthoPan</h1>
        <label for="order">Order</label>
        <select id="order"></select>
        <button id="sortbtn" title="Sort orthogroups by presence contrast inside the selected clade">sort by contrast</button>
        <label for="mode">Value</label>
        <select id="mode">
          <option value="presence">presence</option>
          <option value="copies">copies</option>
        </select>
        <span id="legend" title="Cell colour scale"></span>
        <span id="search-wrap">
          <input id="search" type="search" placeholder="search annotations / OG…" autocomplete="off" />
          <button id="search-order" title="Order orthogroups with the search hits first">Order by hits</button>
          <div id="search-results"></div>
        </span>
        <details id="layers"><summary>Layers</summary><div id="layer-list"></div></details>
        <span id="notice"></span>
        <span id="status">loading…</span>
      </div>
      <div id="body">
        <div id="tree-col">
          <div id="tree-spacer"></div>
          <canvas id="tree"></canvas>
        </div>
        <div id="meta-col">
          <div id="meta-spacer"></div>
          <canvas id="meta"></canvas>
        </div>
        <div id="center">
          <div id="tracks"><canvas id="tracks-canvas"></canvas></div>
          <div id="matrix-wrap">
            <div id="deck"></div>
            <canvas id="overlay"></canvas>
            <div id="tooltip"></div>
          </div>
        </div>
        <div id="labels-col">
          <div id="labels-spacer"></div>
          <canvas id="labels"></canvas>
        </div>
        <div id="panel">
          <div id="drawer-resize"></div>
          <div class="drawer-head">
            <span id="drawer-title">orthogroup</span>
            <span class="grow"></span>
            <label>IDs <select id="id-mode"><option value="display">display</option><option value="raw">raw</option></select></label>
            <a id="dl-fasta" class="dl" download>FASTA</a>
            <a id="dl-aligned" class="dl" download>aligned</a>
            <a id="dl-nwk" class="dl" download>Newick</a>
            <button id="drawer-expand" title="expand / collapse">⤢</button>
            <button id="drawer-close" class="close" aria-label="close">×</button>
          </div>
          <div class="tabs">
            <button class="tab active" data-tab="members">Members</button>
            <button class="tab" data-tab="msa">MSA</button>
            <button class="tab" data-tab="gene-tree">Gene tree</button>
          </div>
          <div id="tab-members" class="tab-pane active"></div>
          <div id="tab-msa" class="tab-pane">
            <div class="pane-toolbar">
              <span id="msa-status"></span>
              <span class="spacer"></span>
              <span id="msa-badges"></span>
              <button id="msa-retry" hidden>retry</button>
              <button id="msa-zoom-out" title="zoom out">−</button>
              <button id="msa-zoom-in" title="zoom in">+</button>
            </div>
            <div class="canvas-wrap"><canvas id="msa-canvas"></canvas></div>
          </div>
          <div id="tab-gene-tree" class="tab-pane">
            <div class="pane-toolbar">
              <label>Colour <select id="tree-field"></select></label>
              <label>Layout
                <select id="tree-mode">
                  <option value="phylogram">phylogram</option>
                  <option value="cladogram">cladogram</option>
                </select>
              </label>
              <span id="tree-status"></span>
              <span class="spacer"></span>
              <button id="tree-zoom-out" title="zoom out">−</button>
              <button id="tree-zoom-in" title="zoom in">+</button>
              <span id="tree-legend" class="tree-legend"></span>
            </div>
            <div class="canvas-wrap"><canvas id="tree-canvas"></canvas></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
